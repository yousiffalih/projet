<div class="min-h-screen bg-slate-950 flex" dir="rtl">

  <!-- SIDEBAR -->
  <aside class="fixed top-0 right-0 h-full z-30 flex flex-col transition-all duration-300 ease-in-out"
    [class.w-64]="sidebarOpen()" [class.w-16]="!sidebarOpen()">
    <div class="flex-1 bg-slate-900 border-l border-white/5 flex flex-col h-full overflow-hidden">

      <!-- Brand -->
      <div class="flex items-center gap-3 px-4 py-5 border-b border-white/5">
        <div class="w-9 h-9 min-w-[2.25rem] bg-gradient-to-br from-teal-400 to-blue-500 rounded-xl flex items-center justify-center shadow-lg shadow-teal-500/20">
          <svg class="w-5 h-5 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"/>
          </svg>
        </div>
        <span *ngIf="sidebarOpen()" class="text-white font-bold text-lg tracking-tight whitespace-nowrap">ClinicSaaS</span>
      </div>

      <!-- Super Admin Quick Switcher -->
      <div *ngIf="user?.role === 'SUPER_ADMIN'" class="px-3 pt-3">
        <a routerLink="/superadmin/clinics"
          class="flex items-center gap-2.5 bg-gradient-to-l from-red-600 to-rose-600 hover:from-red-500 hover:to-rose-500 text-white text-xs font-bold px-3 py-2.5 rounded-xl shadow-lg shadow-red-600/20 transition-all">
          <svg class="w-4 h-4 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
              d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z"/>
          </svg>
          <span *ngIf="sidebarOpen()" class="truncate">🛡️ لوحة المشرف العام</span>
        </a>
      </div>

      <!-- Nav -->
      <nav class="flex-1 py-4 space-y-1 px-2 overflow-y-auto">
        <a *ngFor="let item of navItems"
          [routerLink]="item.route"
          routerLinkActive="bg-gradient-to-l from-teal-500/20 to-transparent text-teal-400"
          [routerLinkActiveOptions]="{exact: false}"
          class="flex items-center gap-3 px-3 py-2.5 rounded-xl transition-all duration-150 text-slate-400 hover:bg-white/5 hover:text-slate-200">

          <!-- Icons -->
          <svg *ngIf="item.icon==='dashboard'" class="w-5 h-5 min-w-[1.25rem]" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 7a2 2 0 012-2h4a2 2 0 012 2v4a2 2 0 01-2 2H5a2 2 0 01-2-2V7zM13 7a2 2 0 012-2h2a2 2 0 012 2v10a2 2 0 01-2 2h-2a2 2 0 01-2-2V7zM3 15a2 2 0 012-2h4a2 2 0 012 2v2a2 2 0 01-2 2H5a2 2 0 01-2-2v-2z"/></svg>
          <svg *ngIf="item.icon==='patients'" class="w-5 h-5 min-w-[1.25rem]" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0z"/></svg>
          <svg *ngIf="item.icon==='calendar'" class="w-5 h-5 min-w-[1.25rem]" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"/></svg>
          <svg *ngIf="item.icon==='doctors'" class="w-5 h-5 min-w-[1.25rem]" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5.121 17.804A13.937 13.937 0 0112 16c2.5 0 4.847.655 6.879 1.804M15 10a3 3 0 11-6 0 3 3 0 016 0zm6 2a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
          <svg *ngIf="item.icon==='reports'" class="w-5 h-5 min-w-[1.25rem]" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 17v-2m3 2v-4m3 4v-6m2 10H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"/></svg>
          <svg *ngIf="item.icon==='settings'" class="w-5 h-5 min-w-[1.25rem]" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"/><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/></svg>

          <span *ngIf="sidebarOpen()" class="text-sm font-medium whitespace-nowrap">{{ item.label }}</span>
        </a>
      </nav>

      <!-- User -->
      <div *ngIf="user" class="border-t border-white/5 p-3">
        <div class="flex items-center gap-3 px-2 py-2 rounded-xl hover:bg-white/5 transition-colors">
          <div class="w-8 h-8 min-w-[2rem] rounded-full bg-gradient-to-br from-teal-400 to-blue-500 flex items-center justify-center text-white text-xs font-bold">
            {{ user.full_name.charAt(0) || 'U' }}
          </div>
          <div *ngIf="sidebarOpen()" class="flex-1 min-w-0">
            <p class="text-white text-xs font-medium truncate">{{ user.full_name }}</p>
            <p class="text-slate-500 text-xs">{{ user.role }}</p>
          </div>
          <button *ngIf="sidebarOpen()" (click)="logout()" id="logout-btn"
            class="text-slate-500 hover:text-red-400 transition-colors">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"/></svg>
          </button>
        </div>
      </div>
    </div>
  </aside>

  <!-- MAIN -->
  <main class="flex-1 flex flex-col min-h-screen transition-all duration-300"
    [class.mr-64]="sidebarOpen()" [class.mr-16]="!sidebarOpen()">

    <!-- Header -->
    <header class="bg-slate-900/80 backdrop-blur border-b border-white/5 px-6 py-4 flex items-center justify-between sticky top-0 z-20">
      <div class="flex items-center gap-4">
        <button (click)="toggleSidebar()" id="sidebar-toggle"
          class="text-slate-400 hover:text-white transition-colors p-1 rounded-lg hover:bg-white/5">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"/></svg>
        </button>
        <span class="text-white font-semibold text-base">ClinicSaaS</span>
      </div>
      <div class="flex items-center gap-3">
        <button class="relative text-slate-400 hover:text-white transition-colors p-2 rounded-lg hover:bg-white/5">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6.002 6.002 0 00-4-5.659V5a2 2 0 10-4 0v.341C7.67 6.165 6 8.388 6 11v3.159c0 .538-.214 1.055-.595 1.436L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9"/></svg>
          <span class="absolute top-1.5 right-1.5 w-2 h-2 bg-teal-400 rounded-full ring-2 ring-slate-900"></span>
        </button>
        <div class="w-8 h-8 rounded-full bg-gradient-to-br from-teal-400 to-blue-500 flex items-center justify-center text-white text-xs font-bold">
          {{ user?.full_name?.charAt(0) || 'U' }}
        </div>
      </div>
    </header>

    <!-- Page Content (child routes render here) -->
    <div class="flex-1 p-6">
      <router-outlet />
    </div>
  </main>
</div>
