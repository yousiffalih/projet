<div class="min-h-screen bg-[#0a0a0f] flex items-center justify-center p-4 relative overflow-hidden">

  <!-- Background glow effects -->
  <div class="absolute inset-0 pointer-events-none">
    <div class="absolute top-1/4 left-1/2 -translate-x-1/2 w-[600px] h-[600px] bg-red-600/5 rounded-full blur-3xl"></div>
    <div class="absolute bottom-0 left-0 w-80 h-80 bg-rose-900/10 rounded-full blur-3xl"></div>
    <div class="absolute top-0 right-0 w-64 h-64 bg-orange-900/8 rounded-full blur-3xl"></div>
    <!-- Grid pattern -->
    <div class="absolute inset-0 opacity-[0.03]"
      style="background-image: linear-gradient(rgba(255,255,255,.1) 1px, transparent 1px),
             linear-gradient(90deg, rgba(255,255,255,.1) 1px, transparent 1px);
             background-size: 40px 40px;">
    </div>
  </div>

  <div class="relative w-full max-w-md" dir="rtl">

    <!-- Top badge -->
    <div class="flex justify-center mb-8">
      <div class="flex items-center gap-2.5 bg-red-500/10 border border-red-500/20 px-4 py-2 rounded-full">
        <div class="w-2 h-2 bg-red-400 rounded-full animate-pulse"></div>
        <span class="text-red-400 text-xs font-semibold tracking-wider uppercase">Super Admin Portal</span>
      </div>
    </div>

    <!-- Card -->
    <div class="bg-white/[0.03] border border-white/8 rounded-3xl p-8 shadow-2xl backdrop-blur-sm">

      <!-- Logo & Title -->
      <div class="text-center mb-8">
        <div class="w-16 h-16 bg-gradient-to-br from-red-600 to-rose-500 rounded-2xl flex items-center justify-center mx-auto mb-4 shadow-lg shadow-red-500/25">
          <svg class="w-8 h-8 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
              d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z"/>
          </svg>
        </div>
        <h1 class="text-white font-bold text-2xl">لوحة المشرف العام</h1>
        <p class="text-slate-500 text-sm mt-1">ClinicSaaS — Super Admin Panel</p>
      </div>

      <!-- Error -->
      <div *ngIf="errorMsg"
        class="mb-5 flex items-center gap-3 bg-red-500/10 border border-red-500/20 text-red-400 text-sm rounded-xl px-4 py-3">
        <svg class="w-4 h-4 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
            d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/>
        </svg>
        {{ errorMsg }}
      </div>

      <!-- Form -->
      <form [formGroup]="form" (ngSubmit)="onSubmit()" class="space-y-4">

        <!-- Email -->
        <div>
          <label class="text-slate-400 text-xs font-medium mb-1.5 block">البريد الإلكتروني</label>
          <div class="relative">
            <input formControlName="email" type="email" id="sa-email"
              placeholder="admin@cliniksaas.com"
              class="w-full bg-white/5 border border-white/10 text-white text-sm rounded-xl
                     px-4 py-3 outline-none focus:ring-2 focus:ring-red-500/40 focus:border-red-500/40
                     placeholder-slate-600 transition-all"
              [class.border-red-500/50]="form.get('email')!.touched && form.get('email')!.invalid"
              dir="ltr">
          </div>
          <p *ngIf="form.get('email')!.touched && form.get('email')!.invalid"
            class="text-red-400 text-xs mt-1">بريد إلكتروني غير صالح</p>
        </div>

        <!-- Password -->
        <div>
          <label class="text-slate-400 text-xs font-medium mb-1.5 block">كلمة المرور</label>
          <div class="relative">
            <input formControlName="password" [type]="showPass ? 'text' : 'password'" id="sa-password"
              placeholder="••••••••"
              class="w-full bg-white/5 border border-white/10 text-white text-sm rounded-xl
                     px-4 py-3 pr-12 outline-none focus:ring-2 focus:ring-red-500/40 focus:border-red-500/40
                     placeholder-slate-600 transition-all"
              [class.border-red-500/50]="form.get('password')!.touched && form.get('password')!.invalid"
              dir="ltr">
            <button type="button" (click)="showPass = !showPass"
              class="absolute left-3 top-1/2 -translate-y-1/2 text-slate-500 hover:text-slate-300 transition-colors p-1">
              <svg *ngIf="!showPass" class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                  d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/>
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                  d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"/>
              </svg>
              <svg *ngIf="showPass" class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                  d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.543-7a9.97 9.97 0 011.563-3.029m5.858.908a3 3 0 114.243 4.243M9.878 9.878l4.242 4.242M9.88 9.88l-3.29-3.29m7.532 7.532l3.29 3.29M3 3l3.59 3.59m0 0A9.953 9.953 0 0112 5c4.478 0 8.268 2.943 9.543 7a10.025 10.025 0 01-4.132 5.411m0 0L21 21"/>
              </svg>
            </button>
          </div>
          <p *ngIf="form.get('password')!.touched && form.get('password')!.invalid"
            class="text-red-400 text-xs mt-1">كلمة المرور قصيرة جداً</p>
        </div>

        <!-- Submit -->
        <button type="submit" id="sa-login-btn"
          [disabled]="isLoading"
          class="w-full bg-gradient-to-l from-red-600 to-rose-500 hover:from-red-500 hover:to-rose-400
                 disabled:opacity-60 text-white font-semibold py-3 rounded-xl transition-all
                 shadow-lg shadow-red-500/20 hover:shadow-red-500/30 active:scale-[0.98]
                 flex items-center justify-center gap-2 mt-2">
          <svg *ngIf="isLoading" class="animate-spin w-4 h-4" fill="none" viewBox="0 0 24 24">
            <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
            <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4z"></path>
          </svg>
          <svg *ngIf="!isLoading" class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
              d="M11 16l-4-4m0 0l4-4m-4 4h14m-5 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h7a3 3 0 013 3v1"/>
          </svg>
          {{ isLoading ? 'جارٍ تسجيل الدخول...' : 'دخول لوحة التحكم' }}
        </button>
      </form>

      <!-- Footer note -->
      <p class="text-center text-slate-600 text-xs mt-6">
        محمية بصلاحيات <span class="text-red-500">SUPER_ADMIN</span> — وصول مقيّد
      </p>
    </div>

    <!-- Back to clinic login -->
    <div class="text-center mt-5">
      <a routerLink="/login" class="text-slate-600 hover:text-slate-400 text-xs transition-colors">
        ← العودة لصفحة دخول العيادة
      </a>
    </div>
  </div>
</div>
