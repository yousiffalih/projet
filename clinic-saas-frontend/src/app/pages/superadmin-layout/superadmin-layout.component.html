<div class="min-h-screen bg-[#0a0a0f] flex" dir="rtl">

  <!-- ══ SIDEBAR ══ -->
  <aside [class]="sidebarOpen() ? 'w-64' : 'w-16'"
    class="flex-shrink-0 bg-[#0d0d14] border-l border-white/5 flex flex-col transition-all duration-300 ease-in-out relative">

    <!-- Logo / Brand -->
    <div class="flex items-center gap-3 px-4 py-5 border-b border-white/5">
      <div class="w-9 h-9 flex-shrink-0 bg-gradient-to-br from-red-600 to-rose-500 rounded-xl flex items-center justify-center shadow-lg shadow-red-500/20">
        <svg class="w-4.5 h-4.5 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24" style="width:18px;height:18px">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
            d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z"/>
        </svg>
      </div>
      <div *ngIf="sidebarOpen()" class="overflow-hidden">
        <p class="text-white font-bold text-sm leading-none">ClinicSaaS</p>
        <p class="text-red-400 text-xs font-medium mt-0.5">Super Admin</p>
      </div>
    </div>

    <!-- Toggle Button -->
    <button (click)="toggleSidebar()"
      class="absolute -left-3 top-20 w-6 h-6 bg-[#0d0d14] border border-white/10 rounded-full
             flex items-center justify-center text-slate-400 hover:text-white transition-colors z-10">
      <svg class="w-3 h-3 transition-transform duration-300" [class.rotate-180]="!sidebarOpen()"
        fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"/>
      </svg>
    </button>

    <!-- Nav Items -->
    <nav class="flex-1 px-3 py-4 space-y-1">
      <a *ngFor="let item of navItems"
        [routerLink]="item.route"
        routerLinkActive="bg-red-500/10 text-red-400 border border-red-500/20"
        [routerLinkActiveOptions]="{exact: true}"
        class="flex items-center gap-3 px-3 py-2.5 rounded-xl text-slate-400 hover:text-white
               hover:bg-white/5 transition-all group"
        [title]="!sidebarOpen() ? item.label : ''">

        <!-- Dashboard icon -->
        <svg *ngIf="item.icon === 'dashboard'" class="w-5 h-5 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
            d="M4 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2V6zM14 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2V6zM4 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2v-2zM14 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2v-2z"/>
        </svg>

        <!-- Clinics icon -->
        <svg *ngIf="item.icon === 'clinics'" class="w-5 h-5 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
            d="M19 21V5a2 2 0 00-2-2H7a2 2 0 00-2 2v16m14 0h2m-2 0h-5m-9 0H3m2 0h5M9 7h1m-1 4h1m4-4h1m-1 4h1m-5 10v-5a1 1 0 011-1h2a1 1 0 011 1v5m-4 0h4"/>
        </svg>

        <span *ngIf="sidebarOpen()" class="text-sm font-medium truncate">{{ item.label }}</span>
      </a>
    </nav>

    <!-- User Profile & Logout -->
    <div *ngIf="sidebarOpen()" class="px-3 py-4 border-t border-white/5 space-y-2">
      <div class="flex items-center gap-3 px-3 py-2 rounded-xl bg-white/[0.03]">
        <div class="w-8 h-8 rounded-full bg-gradient-to-br from-red-600 to-rose-500 flex items-center justify-center text-white text-xs font-bold flex-shrink-0">
          {{ user?.full_name?.charAt(0) || 'A' }}
        </div>
        <div class="flex-1 min-w-0">
          <p class="text-white text-xs font-medium truncate">{{ user?.full_name }}</p>
          <p class="text-red-400 text-xs truncate">Super Admin</p>
        </div>
      </div>
      <button (click)="logout()"
        class="w-full flex items-center gap-3 px-3 py-2 rounded-xl text-slate-500 hover:text-red-400 hover:bg-red-500/5 transition-all text-sm">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
            d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"/>
        </svg>
        تسجيل الخروج
      </button>
    </div>
    <div *ngIf="!sidebarOpen()" class="px-3 py-4 border-t border-white/5">
      <button (click)="logout()" title="تسجيل الخروج"
        class="w-full flex items-center justify-center p-2 rounded-xl text-slate-500 hover:text-red-400 hover:bg-red-500/5 transition-all">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
            d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"/>
        </svg>
      </button>
    </div>
  </aside>

  <!-- ══ MAIN CONTENT ══ -->
  <div class="flex-1 flex flex-col min-w-0">

    <!-- Top Bar -->
    <header class="h-14 bg-[#0d0d14]/80 border-b border-white/5 backdrop-blur-sm flex items-center justify-between px-6 flex-shrink-0">
      <div class="flex items-center gap-3">
        <div class="flex items-center gap-2 bg-red-500/10 border border-red-500/20 px-3 py-1.5 rounded-lg">
          <div class="w-1.5 h-1.5 bg-red-400 rounded-full animate-pulse"></div>
          <span class="text-red-400 text-xs font-semibold">SUPER ADMIN MODE</span>
        </div>
      </div>
      <div class="flex items-center gap-4">
        <span class="text-slate-500 text-xs font-mono">
          {{ currentTime | date:'HH:mm' }}
        </span>
        <div class="w-8 h-8 rounded-full bg-gradient-to-br from-red-600 to-rose-500 flex items-center justify-center text-white text-xs font-bold">
          {{ user?.full_name?.charAt(0) || 'A' }}
        </div>
      </div>
    </header>

    <!-- Page Content -->
    <main class="flex-1 overflow-auto p-6">
      <router-outlet></router-outlet>
    </main>
  </div>
</div>
